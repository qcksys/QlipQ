<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <label><span>OBS input</span><input id="input" list="inputs" placeholder="Mic/Aux" /></label>
    <datalist id="inputs"></datalist>
    <label><span>Display name</span><input id="label" placeholder="The input's name" /></label>
    <label><span>dB per tick</span><input id="step" type="number" min="0.1" max="5" step="0.1" /></label>
    <h3>Meter</h3>
    <label><span>Floor (dB)</span><input id="floor" type="number" min="-96" max="-10" step="1" /></label>
    <label><span>Falloff (%/s)</span><input id="falloff" type="number" min="10" max="2000" step="10" /></label>
    <h3>Press or tap</h3>
    <label>
      <span>Action</span>
      <select id="press">
        <option value="mute">Mute or unmute</option>
        <option value="none">Nothing</option>
      </select>
    </label>
    <p>
      Turn to change the input's volume. Floor is the quietest level the meter shows; falloff is how
      fast the bars drop after a peak. Needs the OBS WebSocket server switched on.
    </p>
    <script src="pi.js"></script>
    <script>
      const field = (id) => document.getElementById(id);
      const fields = ["input", "label", "step", "floor", "falloff", "press"].map(field);

      pi.onSettings = (settings) => {
        field("input").value = settings.input ?? "";
        field("label").value = settings.label ?? "";
        field("step").value = settings.step ?? 0.2;
        field("floor").value = settings.floor ?? -60;
        field("falloff").value = settings.falloff ?? 100;
        field("press").value = settings.press ?? "mute";
      };

      pi.onPluginMessage = (payload) => {
        if (!Array.isArray(payload.inputs)) return;
        field("inputs").replaceChildren(
          ...payload.inputs.map((name) => Object.assign(document.createElement("option"), { value: name })),
        );
      };

      const save = () =>
        pi.save({
          input: field("input").value.trim(),
          label: field("label").value.trim(),
          step: pi.number(field("step"), 0.2),
          floor: pi.number(field("floor"), -60),
          falloff: pi.number(field("falloff"), 100),
          press: field("press").value,
        });
      for (const element of fields) element.addEventListener("change", save);
    </script>
  </body>
</html>
