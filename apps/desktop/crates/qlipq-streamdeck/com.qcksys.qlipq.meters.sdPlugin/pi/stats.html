<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <h3>Rows</h3>
    <label><span>Top</span><select id="row1" class="row"></select></label>
    <label><span>Middle</span><select id="row2" class="row"></select></label>
    <label><span>Bottom</span><select id="row3" class="row"></select></label>
    <h3>Readings</h3>
    <label><span>Update every (s)</span><input id="interval" type="number" min="0.5" max="5" step="0.5" /></label>
    <label>
      <span>GPU</span>
      <select id="gpu"><option value="">Busiest GPU</option></select>
    </label>
    <h3>Bar colours</h3>
    <label><span>CPU</span><input id="cpuColor" type="color" /></label>
    <label><span>GPU</span><input id="gpuColor" type="color" /></label>
    <label><span>RAM</span><input id="ramColor" type="color" /></label>
    <p>The figures match Task Manager. GPU shows the busiest part of the chosen graphics card.</p>
    <script src="pi.js"></script>
    <script>
      const field = (id) => document.getElementById(id);
      const rows = ["row1", "row2", "row3"].map(field);
      const metrics = [
        ["cpu", "CPU"],
        ["gpu", "GPU"],
        ["ram", "RAM"],
        ["none", "Empty"],
      ];
      for (const row of rows) {
        row.replaceChildren(
          ...metrics.map(([value, text]) => Object.assign(document.createElement("option"), { value, text })),
        );
      }
      const defaults = {
        rows: ["cpu", "gpu", "ram"],
        interval: 1,
        gpu: "",
        cpuColor: "#4fb3ff",
        gpuColor: "#49d17d",
        ramColor: "#b48cff",
      };

      /** Selects the saved GPU, keeping an entry for it if this PC no longer reports it. */
      function selectGpu(id) {
        const select = field("gpu");
        if (![...select.options].some((option) => option.value === id)) {
          select.append(Object.assign(document.createElement("option"), { value: id, text: "Saved GPU (not found)" }));
        }
        select.value = id;
      }

      pi.onSettings = (settings) => {
        const saved = { ...defaults, ...settings };
        rows.forEach((row, index) => {
          row.value = saved.rows[index] ?? "none";
        });
        field("interval").value = saved.interval;
        selectGpu(saved.gpu);
        for (const key of ["cpuColor", "gpuColor", "ramColor"]) field(key).value = saved[key];
      };

      pi.onPluginMessage = (payload) => {
        if (!Array.isArray(payload.gpus)) return;
        field("gpu").replaceChildren(
          Object.assign(document.createElement("option"), { value: "", text: "Busiest GPU" }),
          ...payload.gpus.map(({ id, name }) => Object.assign(document.createElement("option"), { value: id, text: name })),
        );
        selectGpu(pi.settings.gpu ?? "");
      };

      const save = () =>
        pi.save({
          rows: rows.map((row) => row.value),
          interval: pi.number(field("interval"), 1),
          gpu: field("gpu").value,
          cpuColor: field("cpuColor").value,
          gpuColor: field("gpuColor").value,
          ramColor: field("ramColor").value,
        });
      for (const element of [...rows, field("interval"), field("gpu"), field("cpuColor"), field("gpuColor"), field("ramColor")]) {
        element.addEventListener("change", save);
      }
    </script>
  </body>
</html>
