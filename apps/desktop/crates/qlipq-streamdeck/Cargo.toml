[package]
name = "qlipq-streamdeck"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
chrono.workspace = true
futures-util = "0.3.34"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation"] }
winreg = "0.55"
