name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      # Generate Astro's `.astro/types.d.ts` (astro:content + `?raw` module types). It's gitignored,
      # so without this `vp check` fails to resolve those virtual modules on a fresh checkout.
      - name: Generate Astro types
        run: vp run qlipq-website#sync

      - name: Format, lint & type check
        run: vp check

      - name: Test OBS metadata tagging
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit ffmpeg
          luajit packages/obs-script/tests/metadata.lua

      - name: Build website
        run: vp run -r build

  winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up WinGet
        shell: pwsh
        run: |
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -AllUsers
      - name: Test and validate WinGet manifests
        shell: pwsh
        run: |
          ./.github/winget/Test-WinGetPublicationState.ps1
          ./.github/winget/Test-WinGetManifest.ps1 -ValidateWithWinGet
